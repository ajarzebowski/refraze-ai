<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Refraze AI result</title>
  <style>
    body {
      font-family: -apple-system, Segoe UI, Roboto, sans-serif;
      width: 340px;
      margin: 0;
      padding: 14px;
      color: #1a1a1a;
      box-sizing: border-box;
    }
    h1 {
      font-size: 14px;
      margin: 0 0 10px;
    }
    .hidden { display: none; }

    #result-text {
      width: 100%;
      min-height: 90px;
      max-height: 260px;
      overflow-y: auto;
      font-size: 14px;
      line-height: 1.4;
      border: 1px solid #ddd;
      border-radius: 6px;
      padding: 10px;
      box-sizing: border-box;
      white-space: pre-wrap;
      background: #fafafa;
    }

    .meta {
      margin-top: 8px;
      font-size: 12px;
      color: #777;
    }

    .actions {
      display: flex;
      gap: 8px;
      margin-top: 12px;
    }

    button {
      flex: 1;
      padding: 8px 10px;
      font-size: 13px;
      cursor: pointer;
      border: none;
      border-radius: 5px;
    }

    #copy-btn {
      background: #10a37f;
      color: white;
    }
    #copy-btn:hover { background: #0d8c6d; }

    #close-btn {
      background: #eee;
      color: #333;
    }
    #close-btn:hover { background: #e0e0e0; }

    .center-message {
      font-size: 13px;
      color: #555;
      line-height: 1.5;
      text-align: center;
      padding: 16px 4px;
    }

    .spinner {
      width: 22px;
      height: 22px;
      margin: 0 auto 10px;
      border: 3px solid #ddd;
      border-top-color: #10a37f;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    #error-message {
      font-size: 13px;
      color: #c0392b;
      line-height: 1.4;
    }

    footer {
      margin-top: 14px;
      padding-top: 10px;
      border-top: 1px solid #eee;
      text-align: center;
    }
    footer a {
      font-size: 12px;
      color: #10a37f;
      text-decoration: none;
      cursor: pointer;
    }
    footer a:hover { text-decoration: underline; }
  </style>
</head>
<body>

  <div id="idle" class="center-message">
    Select text on a page, right-click, and choose <strong>Rephrase selection</strong> to get started.
  </div>

  <div id="loading" class="center-message hidden">
    <div class="spinner"></div>
    Rephrasing (<span id="loading-tone"></span> tone)…
  </div>

  <div id="result" class="hidden">
    <h1>Rephrased text</h1>
    <div id="result-text"></div>
    <div class="meta">
      Used <span id="result-provider"></span> · <span id="result-model"></span> · <span id="result-tone"></span> tone
    </div>
    <div class="actions">
      <button id="copy-btn">Copy</button>
      <button id="close-btn">Close</button>
    </div>
  </div>

  <div id="no-key" class="center-message hidden">
    No API key set for <strong id="no-key-provider"></strong>.<br>
    Add one in Settings to use Rephrase.
  </div>

  <div id="error" class="center-message hidden">
    <div id="error-message"></div>
  </div>

  <footer>
    <a id="settings-link">Settings</a>
  </footer>

  <script src="popup.js"></script>
</body>
</html>
